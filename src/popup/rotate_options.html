<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="rotate_options.css" />
</head>

<body>
    <form>
        <button type="submit" id="disableButton">
            Not Loaded
        </button>
    </form>

    <div id="settingsWindow" class="vstack">
        <form>
            <div id="rotateMeContainer" class="_container vstack">
                <h4>Rotate me</h4>
                <h6>Press 'Shift+R' to rotate</h6>
                <div class="hstack">
                    <input type="checkbox" id="rotateClockwiseCheckbox" name="rotationDirection">
                    <label for="rotationDirection">Rotate clockwise?</label>
                </div>
            </div>
        </form>
    </div>
    <p id="loadedP"></p>



</body>

<script src="../constants.js"></script>
<script src="../utils.js"></script>
<script src="rotate_options.js"></script>

</html>
